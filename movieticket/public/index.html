<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Ticket Booking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {

            background: linear-gradient(to right, #141e30, #243b55);
            font-family: Arial, sans-serif;
            color: white;

        }

        .navbar {

            background-color: rgba(0, 0, 0, 0.8);

        }

        .navbar-brand {

            color: #ffc107 !important;
            font-size: 28px;
            font-weight: bold;

        }

        .hero {

            text-align: center;
            padding: 60px 20px;

        }

        .hero h1 {

            font-size: 50px;
            font-weight: bold;

        }

        .hero p {

            font-size: 20px;
            margin-top: 15px;

        }

        .movie-card {

            background-color: white;
            color: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            transition: 0.3s;

        }

        .movie-card:hover {

            transform: scale(1.03);

        }

        .movie-card img {

            height: 350px;
            object-fit: cover;

        }

        .btn-book {

            background-color: #ffc107;
            border: none;
            font-weight: bold;

        }

        .btn-book:hover {

            background-color: orange;

        }

        footer {

            text-align: center;
            background-color: rgba(0,0,0,0.8);
            padding: 15px;
            margin-top: 40px;
            font-weight: bold;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <i class="bi bi-film"></i>
                Movie Booking
            </a>

        </div>

    </nav>


    <!-- Hero Section -->

    <div class="hero">

        <h1>Book Your Favorite Movies</h1>

        <p>
            Easy Online Ticket Booking for Latest Movies
        </p>

    </div>


    <!-- Movie Cards -->

    <div class="container">

        <div class="row g-4">

            <!-- Movie 1 -->

            <div class="col-md-4">

                <div class="movie-card">

                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
                        class="w-100">

                    <div class="p-3">

                        <h3>Avengers Endgame</h3>

                        <p>
                            Action | Sci-Fi | Adventure
                        </p>

                        <button class="btn btn-book w-100">
                            Book Now
                        </button>

                    </div>

                </div>

            </div>


            <!-- Movie 2 -->

            <div class="col-md-4">

                <div class="movie-card">

                    <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c"
                        class="w-100">

                    <div class="p-3">

                        <h3>Interstellar</h3>

                        <p>
                            Sci-Fi | Space | Drama
                        </p>

                        <button class="btn btn-book w-100">
                            Book Now
                        </button>

                    </div>

                </div>

            </div>


            <!-- Movie 3 -->

            <div class="col-md-4">

                <div class="movie-card">

                    <img src="https://images.unsplash.com/photo-1513106580091-1d82408b8cd6"
                        class="w-100">

                    <div class="p-3">

                        <h3>Joker</h3>

                        <p>
                            Thriller | Crime | Drama
                        </p>

                        <button class="btn btn-book w-100">
                            Book Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        © 2026 Movie Ticket Booking System | Node.js & Express.js

    </footer>

</body>

</html>
