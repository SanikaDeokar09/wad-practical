<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Academic Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {

            background: linear-gradient(to right, #dbeafe, #fef9c3);
            font-family: Arial, sans-serif;
            min-height: 100vh;

        }

        .navbar {

            background-color: #0d6efd;

        }

        .navbar-brand {

            color: white !important;
            font-size: 28px;
            font-weight: bold;

        }

        h1 {

            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
            color: #0d1b52;
            font-weight: bold;

        }

        .table-box {

            background-color: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;

        }

        .table-box:hover {

            transform: scale(1.02);

        }

        .table-title {

            text-align: center;
            margin-bottom: 20px;
            color: #0d6efd;
            font-weight: bold;

        }

        .table th {

            background-color: #0d6efd;
            color: white;
            text-align: center;

        }

        .table td {

            text-align: center;
            font-weight: 600;

        }

        .pass {

            color: green;
            font-weight: bold;

        }

        .fail {

            color: red;
            font-weight: bold;

        }

        .cgpa {

            color: purple;
            font-weight: bold;

        }

        footer {

            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 50px;
            font-weight: bold;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <i class="bi bi-mortarboard-fill"></i>
                Student Dashboard
            </a>

        </div>

    </nav>


    <!-- Heading -->

    <h1>Student Academic Report</h1>


    <!-- Tables -->

    <div class="container">

        <div class="row g-4">

            <!-- Left Table -->

            <div class="col-md-6">

                <div class="table-box">

                    <h3 class="table-title">
                        <i class="bi bi-check-circle-fill"></i>
                        Student Results
                    </h3>

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>Student Name</th>
                                <th>Result</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>Srushti</td>
                                <td class="pass">Pass</td>
                            </tr>

                            <tr>
                                <td>Payal</td>
                                <td class="pass">Pass</td>
                            </tr>

                            <tr>
                                <td>Rahul</td>
                                <td class="fail">Fail</td>
                            </tr>

                            <tr>
                                <td>Aryan</td>
                                <td class="pass">Pass</td>
                            </tr>

                            <tr>
                                <td>Neha</td>
                                <td class="pass">Pass</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- Right Table -->

            <div class="col-md-6">

                <div class="table-box">

                    <h3 class="table-title">
                        <i class="bi bi-bar-chart-fill"></i>
                        Student CGPA
                    </h3>

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>Student Name</th>
                                <th>CGPA</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>
                                <td>Srushti</td>
                                <td class="cgpa">9.1</td>
                            </tr>

                            <tr>
                                <td>Payal</td>
                                <td class="cgpa">8.8</td>
                            </tr>

                            <tr>
                                <td>Rahul</td>
                                <td class="cgpa">5.4</td>
                            </tr>

                            <tr>
                                <td>Aryan</td>
                                <td class="cgpa">8.9</td>
                            </tr>

                            <tr>
                                <td>Neha</td>
                                <td class="cgpa">9.4</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        © 2026 Student Academic Dashboard | MMCOE Pune

    </footer>

</body>

</html>
