<!DOCTYPE html>
<html>
<head>
  <title>Firebase Login</title>
</head>

<body>

<h2>Login</h2>

<input type="email" id="email" placeholder="Enter Email">
<br><br>

<input type="password" id="password" placeholder="Enter Password">
<br><br>

<button onclick="register()">Register</button>

<button onclick="login()">Login</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4WBWMdEOjCd33MGaQwMSCqWv-HAn_Bss",
  authDomain: "project-51382.firebaseapp.com",
  projectId: "project-51382",
  storageBucket: "project-51382.firebasestorage.app",
  messagingSenderId: "382648031075",
  appId: "1:382648031075:web:038ced27d7df696fabe556",
  measurementId: "G-713YTR55V9"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = function () {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)

    .then(() => {

      document.getElementById("msg").innerHTML =
        "Registration Successful";

    })

    .catch((error) => {

      document.getElementById("msg").innerHTML =
        error.message;

    });

};

window.login = function () {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)

    .then(() => {

      document.getElementById("msg").innerHTML =
        "Login Successful";

      window.location.href = "ecomm.html";

    })

    .catch((error) => {

      document.getElementById("msg").innerHTML =
        error.message;

    });

};

</script>

</body>
</html>
