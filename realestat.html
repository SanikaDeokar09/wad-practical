<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #0d6efd;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
            font-weight: bold;
        }

        .hero-section {
            background: url('https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
            height: 400px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-section h1 {
            background-color: rgba(0,0,0,0.6);
            padding: 15px 25px;
            border-radius: 10px;
        }

        .property-card img {
            height: 220px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        footer {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        .btn-contact {
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Dream Homes</a>

            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Properties</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <h1>Find Your Dream Property</h1>
    </section>

    <!-- Properties -->
    <div class="container my-5">

        <div class="row g-4">

            <!-- Property 1 -->
            <div class="col-md-4">
                <div class="card property-card shadow">
                    <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be?q=80&w=800&auto=format&fit=crop"
                        class="card-img-top" alt="House">

                    <div class="card-body">
                        <h4 class="card-title">Luxury Villa</h4>

                        <p><b>Address:</b> Baner, Pune</p>

                        <p class="price">₹ 1.5 Cr</p>

                        <button class="btn btn-primary btn-contact"
                            onclick="contactMessage('Luxury Villa')">
                            Contact Us
                        </button>
                    </div>
                </div>
            </div>

            <!-- Property 2 -->
            <div class="col-md-4">
                <div class="card property-card shadow">
                    <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=800&auto=format&fit=crop"
                        class="card-img-top" alt="Apartment">

                    <div class="card-body">
                        <h4 class="card-title">Modern Apartment</h4>

                        <p><b>Address:</b> Wakad, Pune</p>

                        <p class="price">₹ 85 Lakh</p>

                        <button class="btn btn-primary btn-contact"
                            onclick="contactMessage('Modern Apartment')">
                            Contact Us
                        </button>
                    </div>
                </div>
            </div>

            <!-- Property 3 -->
            <div class="col-md-4">
                <div class="card property-card shadow">
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=800&auto=format&fit=crop"
                        class="card-img-top" alt="Bungalow">

                    <div class="card-body">
                        <h4 class="card-title">Premium Bungalow</h4>

                        <p><b>Address:</b> Kothrud, Pune</p>

                        <p class="price">₹ 2 Cr</p>

                        <button class="btn btn-primary btn-contact"
                            onclick="contactMessage('Premium Bungalow')">
                            Contact Us
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Dream Homes Real Estate Portal | All Rights Reserved</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function contactMessage(propertyName) {
            alert("Thank you for showing interest in " + propertyName + ". Our team will contact you soon!");
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
