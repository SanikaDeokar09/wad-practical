<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #dfe9f3, #ffffff);
            font-family: Arial, sans-serif;
        }

        .header{
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .registration-box{
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            margin-top: 40px;
        }

        .count-box{
            background: #198754;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        footer{
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>Hospital Management System</h1>
        <p>Patient Registration Portal</p>
    </div>

    <!-- Registration Form -->
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="registration-box">

                    <h3 class="text-center mb-4">Patient Registration Form</h3>

                    <form id="patientForm">

                        <div class="mb-3">
                            <label class="form-label">Patient Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>

                            <select class="form-select" id="gender" required>
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobile" maxlength="10" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Disease / Problem</label>
                            <textarea class="form-control" id="disease" rows="3" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Register Patient
                        </button>

                    </form>

                    <!-- Patient Count -->
                    <div class="count-box">
                        Total Patients Registered:
                        <span id="patientCount">0</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        © 2026 Hospital Management System | All Rights Reserved
    </footer>

    <!-- JavaScript -->
    <script>

        // Get count from local storage
        let patientCount = localStorage.getItem("patientCount");

        if(patientCount == null){
            patientCount = 0;
        }

        document.getElementById("patientCount").innerText = patientCount;

        // Form submit event
        document.getElementById("patientForm").addEventListener("submit", function(event){

            event.preventDefault();

            let mobile = document.getElementById("mobile").value;

            // Mobile validation
            let mobilePattern = /^[0-9]{10}$/;

            if(!mobilePattern.test(mobile))
            {
                alert("Mobile number must be exactly 10 digits");
                return;
            }

            // Increase count
            patientCount++;

            // Store in local storage
            localStorage.setItem("patientCount", patientCount);

            // Update display
            document.getElementById("patientCount").innerText = patientCount;

            alert("Patient Registered Successfully!");

            // Reset form
            document.getElementById("patientForm").reset();

        });

    </script>

</body>
</html>
